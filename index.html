<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Portafolio de Luis Manosalva — Estudiante de Ingeniería de Sistemas, desarrollo web con HTML, CSS y JavaScript.">

    <title>Luis Manosalva — Portafolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header id="header-principal">
        <div class="header-left">
            <h1>Luis Manosalva</h1>
        </div>

        <nav id="nav-principal">
            <a href="#inicio">Inicio</a>
            <a href="#sobre-mi">Sobre mí</a>
            <a href="#proyectos">Proyectos</a>
            <a href="#contacto">Contacto</a>
        </nav>

        <div class="header-actions">
            <button id="btn-tema" aria-label="Cambiar tema">🌙</button>
            <button id="btn-menu" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- Overlay for mobile nav -->
    <div class="nav-overlay" id="nav-overlay"></div>

    <main>

        <section id="inicio">
            <div class="presentacion reveal">

                <img src="Imagenes/luis.jpg" alt="Foto de Luis">

                <div>
                    <h2 id="sobre-mi">Sobre mí</h2>

                    <p>
                        Estudiante de Ingeniería de Sistemas interesado en el desarrollo de software y el desarrollo web
                        con HTML, CSS y JavaScript.
                    </p>


                    <a href="#" class="boton" id="btnProyectos">Ver mis proyectos</a>
                    <p id="mensaje"></p>
                </div>

            </div>
        </section>

        <section id="proyectos" class="reveal">
            <h2>Mis proyectos</h2>

            <div class="proyectos" id="lista-proyectos">



            </div>
        </section>

        <section id="contacto" class="reveal">
            <h2>Contacto</h2>
            <form id="formulario-contacto">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre">
                <p id="error-nombre" class="mensaje"></p>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email">
                <p id="error-email" class="mensaje"></p>

                <label for="mensaje-contacto">Mensaje</label>
                <textarea id="mensaje-contacto" name="mensaje"></textarea>
                <p id="error-mensaje" class="mensaje"></p>

                <button type="submit">Enviar mensaje</button>

            </form>
        </section>

    </main>
    <div id="modal-proyecto" class="modal">

        <div class="modal-contenido">

            <button id="cerrar-modal" class="cerrar-modal">
                ×
            </button>

            <img id="modal-imagen" src="" alt="">

            <h2 id="modal-titulo"></h2>

            <p id="modal-descripcion"></p>

            <p id="modal-tecnologia"></p>

            <a id="modal-enlace" href="#" target="_blank">
                Ver proyecto
            </a>

            <button id="btn-cerrar-modal">
                Cerrar
            </button>

        </div>

    </div>
    <footer>
        <div class="footer-links">
            <a href="#" aria-label="GitHub" title="GitHub">⌨️</a>
            <a href="#" aria-label="LinkedIn" title="LinkedIn">💼</a>
            <a href="#" aria-label="Email" title="Email">✉️</a>
        </div>
        <p>© 2026 Luis Manosalva</p>
    </footer>
    <script src="javascript/script.js"></script>
</body>

</html>
