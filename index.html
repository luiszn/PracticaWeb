<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Catálogo - Héroes del Silencio</title>
</head>

<body>

    <nav class="navbar">
        <div class="nav-brand">Héroes del Silencio</div>
        <ul class="nav-links">
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#biografia">Biografía</a></li>
            <li><a href="#discos">Discografía</a></li>
            <li><a href="#canciones">Canciones</a></li>
            <li><a href="#galeria">Galería</a></li>
        </ul>
    </nav>

    <header class="hero" id="inicio">
        <h1>Héroes del Silencio</h1>
        <p>Rock en español · 1984 - 2007</p>
    </header>

    <main>
        <section class="seccion-bio" id="biografia">
            <h2>Biografía</h2>
            <div class="bio-content">
                <p class="bio-texto"></p>
                <div class="miembros-grid"></div>
            </div>
        </section>

        <section class="seccion-discos" id="discos">
            <h2>Discografía</h2>
            <div class="discos-grid"></div>
        </section>

        <section class="seccion-canciones" id="canciones">
            <h2>Canciones</h2>
            <div class="canciones-controls">
                <input type="text" id="buscar-cancion" placeholder="Buscar canción..." class="buscar-input">
                <select id="filtro-album" class="filtro-select">
                    <option value="todos">Todos los álbumes</option>
                </select>
            </div>
            <ul class="cancion-list"></ul>
        </section>

        <section class="seccion-galeria" id="galeria">
            <h2>Galería</h2>
            <div class="galeria-grid"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Fan page Héroes del Silencio — Creado con admiración</p>
    </footer>

    <script src="javascript/app.js"></script>
</body>

</html>
